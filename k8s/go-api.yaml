apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  labels:
    app: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api
          image: ghcr.io/viminaria/go-http-api-project:arm64-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DYNAMODB_TABLE
              value: "k3s-cluster-go-api-items"
            - name: AWS_REGION
              value: "eu-north-1"
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  labels:
    app: go-api
spec:
  type: ClusterIP
  selector:
    app: go-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api-ingress
  annotations:
    traefik.middlewares.kubernetes.io/crd: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: go-api._DNS_ZONE_
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 80

