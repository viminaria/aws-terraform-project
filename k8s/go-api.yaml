apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  labels:
    app: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api
          image: ECR_REPOSITORY_URL:latest
          ports:
            - containerPort: 8080
          env:
            - name: DYNAMODB_TABLE
              value: "k3s-cluster-go-api-items"
            - name: AWS_REGION
              value: "eu-central-1"
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  labels:
    app: go-api
spec:
  type: NodePort
  selector:
    app: go-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 31080
